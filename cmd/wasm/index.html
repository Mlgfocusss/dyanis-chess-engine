<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Dyanis — WASM smoke test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  pre { background: #111; color: #0f0; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
  button, input { font-size: 1rem; padding: 0.3rem 0.6rem; margin: 0.2rem 0; }
  input { width: 180px; }
</style>
</head>
<body>
<h1>Dyanis — WASM smoke test</h1>
<p>Это не финальный UI (он будет на шаге 8) — просто проверка, что wasm-сборка
   работает и API из <code>cmd/wasm/main.go</code> отвечает как надо.</p>

<div>
  <button id="reset">New game</button>
  <button id="perft">Perft(3)</button>
  <br />
  <input id="moveInput" placeholder="e4 или e2e4" />
  <button id="move">Make move</button>
  <br />
  <button id="engine">Engine move (depth 3)</button>
  <button id="undo">Undo</button>
  <br />
  <button id="loadBook">Load book (assets/gm2001.bin)</button>
  <button id="clearBook">Clear book</button>
</div>

<p id="bookStatus">book: not loaded</p>
<pre id="out">loading wasm...</pre>

<script src="wasm_exec.js"></script>
<script>
const out = document.getElementById("out");
function log(jsonString) {
  try {
    out.textContent = JSON.stringify(JSON.parse(jsonString), null, 2);
  } catch (e) {
    out.textContent = String(jsonString);
  }
}

function refreshBookStatus() {
  const info = JSON.parse(Dyanis.bookInfo());
  document.getElementById("bookStatus").textContent = info.loaded
    ? `book: loaded (${info.entries} entries)`
    : "book: not loaded";
}

const go = new Go();
WebAssembly.instantiateStreaming(fetch("dyanis.wasm"), go.importObject).then((result) => {
  go.run(result.instance);
  log(Dyanis.getState());

  document.getElementById("reset").onclick = () => log(Dyanis.newGame());
  document.getElementById("perft").onclick = () => log(Dyanis.perft(3));
  document.getElementById("move").onclick = () => {
    const v = document.getElementById("moveInput").value;
    log(Dyanis.makeMove(v));
    document.getElementById("moveInput").value = "";
  };
  document.getElementById("engine").onclick = () => log(Dyanis.engineMove(3, 0));
  document.getElementById("undo").onclick = () => log(Dyanis.undo());

  document.getElementById("loadBook").onclick = async () => {
    try {
      // Path is relative to this page (served from cmd/wasm/), going
      // up to the repo root's assets/ folder — run the http server
      // from the REPO ROOT, not from cmd/wasm, or this 404s. See
      // wasm/README.md.
      const res = await fetch("../../assets/gm2001.bin");
      if (!res.ok) throw new Error("fetch failed: " + res.status);
      const buf = await res.arrayBuffer();
      log(Dyanis.loadBook(new Uint8Array(buf)));
    } catch (e) {
      out.textContent = "book load error: " + e;
    }
    refreshBookStatus();
  };
  document.getElementById("clearBook").onclick = () => {
    log(Dyanis.clearBook());
    refreshBookStatus();
  };

  refreshBookStatus();
}).catch((err) => {
  out.textContent = "wasm load error: " + err;
});
</script>
</body>
</html>
